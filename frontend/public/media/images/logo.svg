<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="vxGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>
  
  <!-- Cyber Glyph Icon -->
  <g transform="translate(6, 10)">
    <rect width="44" height="44" rx="10" fill="url(#vxGrad)" filter="url(#glow)"/>
    <path d="M12 16 L22 32 L32 16" stroke="#050713" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 26 L30 34" stroke="#050713" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="66" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif" font-size="26" font-weight="900" fill="#ffffff" letter-spacing="1">
    VORTEX
  </text>
  <text x="67" y="50" font-family="monospace, sans-serif" font-size="8.5" font-weight="700" fill="#00f0ff" letter-spacing="2.8" opacity="0.9">
    QUANTUM TERMINAL
  </text>
</svg>